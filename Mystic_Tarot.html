<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Tarot: Gesture Interface</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
        :root {
            --color-gold: #FFD700;
            --color-purple: #9B59B6;
            --color-deep: #0a0510;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-deep);
            font-family: 'Quicksand', sans-serif;
            color: white;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to 3D if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Header */
        header {
            text-align: center;
            text-shadow: 0 0 10px var(--color-purple);
            transition: opacity 0.5s ease;
        }

        h1 {
            font-family: 'Cinzel', serif;
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 4px;
            background: linear-gradient(to right, #fff, var(--color-gold));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            margin-top: 5px;
            font-size: 1rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        /* Instruction/Gesture Feedback */
        #gesture-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #point-counter {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: gold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }

        #gesture-debug {
            position: absolute;
            bottom: 5%;
            left: 10%;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #fff;
            z-index: 999;
            pointer-events: none;
            max-width: 40%;
            white-space: pre-wrap;
        }
        
        .gesture-icon {
            font-size: 4rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px var(--color-gold));
        }

        .instruction-text {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--color-gold);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border: 1px solid var(--color-purple);
            border-radius: 4px;
        }

        /* Card Interpretation Overlay */
        #reading-display {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            background: rgba(10, 5, 16, 0.85);
            border: 1px solid var(--color-gold);
            padding: 30px;
            text-align: center;
            border-radius: 2px;
            box-shadow: 0 0 30px rgba(155, 89, 182, 0.3);
            opacity: 0;
            transition: opacity 1s, transform 1s cubic-bezier(0.19, 1, 0.22, 1);
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        #reading-display.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #card-name {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--color-gold);
            margin-bottom: 10px;
        }

        #card-meaning {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
        }

        /* Loading / Camera Feed Wrapper */
        #camera-status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #444;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #ff4444;
            border-radius: 50%;
            box-shadow: 0 0 5px #ff4444;
        }
        .status-dot.active {
            background-color: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Hidden video element for MediaPipe */
        #input-video {
            display: none;
        }

        /* Start Overlay */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s;
        }
        
        #start-btn, .option-btn {
            background: transparent;
            color: var(--color-gold);
            border: 2px solid var(--color-gold);
            padding: 15px 40px;
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #start-btn:hover, .option-btn:hover {
            background: var(--color-gold);
            color: #000;
            box-shadow: 0 0 20px var(--color-gold);
        }

    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-overlay">
        <h1 style="margin-bottom: 20px;">Arcana Vision</h1>
        <p id="start-desc" style="margin-bottom: 40px; color: #888;">Allow camera access for gesture control</p>
        <button id="start-btn">Begin Reading</button>
        <div id="reading-options" style="display: none; gap: 20px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
            <button id="single-card-btn" class="option-btn">Read Tarot Card</button>
            <button id="celestial-btn" class="option-btn">Celestial Energies</button>
        </div>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <header>
            <h1>THE ARCANA</h1>
            <p class="subtitle">Open Palm to Start &bull; Thumb Left/Right to Browse &bull; Fist to Select</p>
        </header>
        
        <div id="camera-status" title="Camera Status">
            <div class="status-dot" id="status-dot"></div>
        </div>

        <div id="gesture-debug">gesture: -\naction: -</div>

        <div id="gesture-feedback">
            <div class="gesture-icon">✋</div>
            <div class="instruction-text" id="instruction-label">Show Hand</div>
        </div>

        <div id="point-counter"></div>

        <button id="toggle-ghost-hand" style="position: fixed; bottom: 30px; right: 30px; background: rgba(26, 11, 46, 0.9); color: #FFD700; border: 2px solid #FFD700; padding: 12px 24px; font-family: 'Cinzel', serif; cursor: pointer; z-index: 1000; border-radius: 4px; font-size: 0.9rem; transition: all 0.3s; pointer-events: auto; box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); text-transform: uppercase; letter-spacing: 1px;">
            Enable Ghost Hand
        </button>

        <div id="reading-display">
            <h2 id="card-name">The Fool</h2>
            <p id="card-meaning">New beginnings, innocence, spontaneity, a free spirit.</p>
        </div>
    </div>

    <!-- 3D Scene Container -->
    <div id="canvas-container"></div>

    <!-- Video Source for Vision -->
    <video id="input-video"></video>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    
    <!-- MediaPipe Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // --- 1. Data: The Major Arcana ---
        const majorArcana = [
            { id: 0, name: "The Fool", meaning: "New beginnings and leaps of faith. Embrace curiosity and trust the journey; every ending is a new start." },
            { id: 1, name: "The Magician", meaning: "Personal power and focused action. You have tools and talents — channel them with intent to create results." },
            { id: 2, name: "The High Priestess", meaning: "Inner knowing and quiet mystery. Turn inward, listen to intuition, and honor what your deeper self reveals." },
            { id: 3, name: "The Empress", meaning: "Nurturing abundance and creativity. Tend to projects and relationships with warmth; growth follows care." },
            { id: 4, name: "The Emperor", meaning: "Authority, structure, and steady leadership. Ground plans in discipline and protect what you build." },
            { id: 5, name: "The Hierophant", meaning: "Tradition, guidance, and shared beliefs. Seek mentors or community wisdom when structure is needed." },
            { id: 6, name: "The Lovers", meaning: "Meaningful choices in love and values. Harmony arises when choices align with your true heart." },
            { id: 7, name: "The Chariot", meaning: "Determined movement and willpower. Harness opposing forces and steer confidently toward your goal." },
            { id: 8, name: "Strength", meaning: "Gentle courage and steady resolve. Compassion and patience overcome obstacles more than force." },
            { id: 9, name: "The Hermit", meaning: "Solitude for clarity and inner guidance. A period of reflection brings luminous answers." },
            { id: 10, name: "Wheel of Fortune", meaning: "Cycles and turning points in fate. Embrace change: luck shifts, and new opportunities rotate into view." },
            { id: 11, name: "Justice", meaning: "Balance, accountability, and truth. Actions have consequences; use fairness as a guiding principle." },
            { id: 12, name: "The Hanged Man", meaning: "Surrender and altered perspective. Release control, and a new way of seeing will reveal itself." },
            { id: 13, name: "Death", meaning: "Transformation and necessary endings. Let go of what no longer serves to make room for renewal." },
            { id: 14, name: "Temperance", meaning: "Moderation and alchemy of opposites. Blend patience with small steady changes to restore balance." },
            { id: 15, name: "The Devil", meaning: "Attachments and shadow patterns. Name the chains, understand them, and choose freedom deliberately." },
            { id: 16, name: "The Tower", meaning: "Sudden upheaval that clears false foundations. Though unsettling, it frees you to rebuild stronger." },
            { id: 17, name: "The Star", meaning: "Hope, healing, and gentle renewal. Reconnect to optimism and let inspiration guide recovery." },
            { id: 18, name: "The Moon", meaning: "Illusion, dreams, and the subconscious. Beware of confusion; explore symbolism and listen to intuition." },
            { id: 19, name: "The Sun", meaning: "Joy, clarity, and vitality. Success shines through; celebrate progress and vitality." },
            { id: 20, name: "Judgement", meaning: "Awakening and reclaiming purpose. Reflect honestly and answer the call to transform." },
            { id: 21, name: "The World", meaning: "Completion and integration. A cycle closes with mastery; celebrate the whole journey and new horizons." }
        ];

        // --- Celestial Energies Data ---
        const celestialEnergies = [
            { id: 0, name: "Stardust", meaning: "Infinite possibilities awaiting crystallisation. You carry the seeds of creation within — plant them with intention." },
            { id: 1, name: "Eclipse", meaning: "A shadow passes over the known. Hidden influences are at play. What lies beneath the surface matters now." },
            { id: 2, name: "Nova", meaning: "Explosive transformation bursts forth. Old structures shatter to make room for rapid, powerful growth." },
            { id: 3, name: "Cosmos", meaning: "Infinite wisdom flows through you. Connect to the universal — answers lie in the vastness within." },
            { id: 4, name: "Nebula", meaning: "Creative mist of potential surrounds you. Dreams are taking form. Nurture what is forming in the unseen." },
            { id: 5, name: "The Void", meaning: "Sacred emptiness calls you inward. In the space between thoughts, profound truths await." },
            { id: 6, name: "Aurora", meaning: "Ethereal hope dances across your sky. Renewal and inspiration arrive in unexpected hues." },
            { id: 7, name: "Black Hole", meaning: "Gentic gravity transforms what enters. Endings are not destruction — they are compression before rebirth." },
            { id: 8, name: "Comet", meaning: "Swift change burns across your path. Destiny approaches — be ready to act with clarity." },
            { id: 9, name: "Celestial Echo", meaning: "Cause and effect ripple across time. What you send out returns transformed. Choose wisely." },
            { id: 10, name: "Cosmic Balance", meaning: "Opposites harmonise in the great scale. Find the middle path where forces align in peace." },
            { id: 11, name: "Twilight", meaning: "Liminal space between worlds. Neither here nor there — honour the in-between; transition is sacred." },
            { id: 12, name: "Zenith", meaning: "Peak power flows through you. This is your moment of highest potential — reach for the apex." },
            { id: 13, name: "The Abyss", meaning: "The deep calls you to confront the unknown. Face what scares you — courage hides in the depths." },
            { id: 14, name: "Radiance", meaning: "Inner light breaks through confusion. Clarity arrives; your path illuminated from within." },
            { id: 15, name: "Wavelength", meaning: "Synchronicity hums through all things. You are in tune — follow the resonance of meaningful coincidences." },
            { id: 16, name: "Singularity", meaning: "All possibilities converge in one point. Before the explosion of choice, hold the stillness." },
            { id: 17, name: "The Veil", meaning: "Truth hides behind illusion. Look beyond the visible — the real lies beneath the surface." },
            { id: 18, name: "Inner Cosmos", meaning: "The universe reflects within. Self-knowledge expands — you are your own cosmos of infinite depth." },
            { id: 19, name: "Cosmic Breath", meaning: "Life force moves through all things. New cycles begin with the exhale of what no longer serves." },
            { id: 20, name: "The Wanderer", meaning: "A soul journeys through dimensions. Your path leads inward and outward — both are one." }
        ];

        // --- Deck Selector ---
        function getDeckData() {
            return readingMode === 'celestial' ? [...celestialEnergies] : [...majorArcana];
        }

        // Shuffle function for authenticity
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }
        let deckData = shuffle(getDeckData());

        // --- 2. Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0510, 0.02); // Deep purple fog

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        // Post-Processing (Bloom) - gentle settings to not obscure cards
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.6;
        bloomPass.strength = 0.4; // Gentle glow — won't darken cards
        bloomPass.radius = 0.3;
        
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // Lights — boosted so card textures are clearly visible
        const ambientLight = new THREE.AmbientLight(0xffffff, 3.5); 
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x9B59B6, 3, 60);
        pointLight.position.set(0, 5, 10);
        scene.add(pointLight);

        const goldLight = new THREE.PointLight(0xFFD700, 2, 30);
        goldLight.position.set(5, -5, 8);
        scene.add(goldLight);

        // --- 3. Procedural Textures (No External Assets) ---
        const cardIcons = {
            0: 'mdi:shoe-print', 1: 'mdi:star-four-points', 2: 'mdi:book-open-page-variant',
            3: 'mdi:flower-tulip', 4: 'mdi:crown', 5: 'mdi:key-variant',
            6: 'mdi:heart', 7: 'mdi:shield', 8: 'mdi:paw',
            9: 'mdi:lantern', 10: 'mdi:rotate-right', 11: 'mdi:scale-balance',
            12: 'mdi:tree', 13: 'mdi:skull', 14: 'mdi:water',
            15: 'mdi:fire', 16: 'mdi:flash', 17: 'mdi:star',
            18: 'mdi:weather-night', 19: 'mdi:weather-sunny',             20: 'mdi:bell', 21: 'mdi:earth'
        };

        const celestialIcons = {
            0: 'mdi:star-four-points', 1: 'mdi:moon-waning-crescent', 2: 'mdi:star-circle',
            3: 'mdi:blur', 4: 'mdi:cloud', 5: 'mdi:alpha-x-circle',
            6: 'mdi:white-balance-sunny', 7: 'mdi:circle-outline', 8: 'mdi:meteor',
            9: 'mdi:waves', 10: 'mdi:scale-balance', 11: 'mdi:weather-partly-cloudy',
            12: 'mdi:arrow-up-bold', 13: 'mdi:eye-off', 14: 'mdi:lightbulb',
            15: 'mdi:sine-wave', 16: 'mdi:circle-medium', 17: 'mdi:blinds',
            18: 'mdi:brain', 19: 'mdi:meditation', 20: 'mdi:hiking'
        };

        const WIKI_THUMB = 'https://upload.wikimedia.org/wikipedia/commons/thumb/';
        const cardArt = {
            0: WIKI_THUMB + '9/90/RWS_Tarot_00_Fool.jpg/300px-RWS_Tarot_00_Fool.jpg',
            1: WIKI_THUMB + 'd/de/RWS_Tarot_01_Magician.jpg/300px-RWS_Tarot_01_Magician.jpg',
            2: WIKI_THUMB + '8/88/RWS_Tarot_02_High_Priestess.jpg/300px-RWS_Tarot_02_High_Priestess.jpg',
            3: WIKI_THUMB + 'a/af/RWS_Tarot_03_Empress.jpg/300px-RWS_Tarot_03_Empress.jpg',
            4: WIKI_THUMB + 'c/c3/RWS_Tarot_04_Emperor.jpg/300px-RWS_Tarot_04_Emperor.jpg',
            5: WIKI_THUMB + '8/8d/RWS_Tarot_05_Hierophant.jpg/300px-RWS_Tarot_05_Hierophant.jpg',
            6: WIKI_THUMB + '3/3a/RWS_Tarot_06_Lovers.jpg/300px-RWS_Tarot_06_Lovers.jpg',
            7: WIKI_THUMB + '9/9b/RWS_Tarot_07_Chariot.jpg/300px-RWS_Tarot_07_Chariot.jpg',
            8: WIKI_THUMB + 'f/f5/RWS_Tarot_08_Strength.jpg/300px-RWS_Tarot_08_Strength.jpg',
            9: WIKI_THUMB + '4/4d/RWS_Tarot_09_Hermit.jpg/300px-RWS_Tarot_09_Hermit.jpg',
            10: WIKI_THUMB + '3/3c/RWS_Tarot_10_Wheel_of_Fortune.jpg/300px-RWS_Tarot_10_Wheel_of_Fortune.jpg',
            11: WIKI_THUMB + 'e/e0/RWS_Tarot_11_Justice.jpg/300px-RWS_Tarot_11_Justice.jpg',
            12: WIKI_THUMB + '2/2b/RWS_Tarot_12_Hanged_Man.jpg/300px-RWS_Tarot_12_Hanged_Man.jpg',
            13: WIKI_THUMB + 'd/d7/RWS_Tarot_13_Death.jpg/300px-RWS_Tarot_13_Death.jpg',
            14: WIKI_THUMB + 'f/f8/RWS_Tarot_14_Temperance.jpg/300px-RWS_Tarot_14_Temperance.jpg',
            15: WIKI_THUMB + '5/55/RWS_Tarot_15_Devil.jpg/300px-RWS_Tarot_15_Devil.jpg',
            16: WIKI_THUMB + '5/53/RWS_Tarot_16_Tower.jpg/300px-RWS_Tarot_16_Tower.jpg',
            17: WIKI_THUMB + 'd/db/RWS_Tarot_17_Star.jpg/300px-RWS_Tarot_17_Star.jpg',
            18: WIKI_THUMB + '7/7f/RWS_Tarot_18_Moon.jpg/300px-RWS_Tarot_18_Moon.jpg',
            19: WIKI_THUMB + '1/17/RWS_Tarot_19_Sun.jpg/300px-RWS_Tarot_19_Sun.jpg',
            20: WIKI_THUMB + 'd/dd/RWS_Tarot_20_Judgement.jpg/300px-RWS_Tarot_20_Judgement.jpg',
            21: WIKI_THUMB + 'f/ff/RWS_Tarot_21_World.jpg/300px-RWS_Tarot_21_World.jpg'
        };

        const celestialArt = {};

        function createCelestialArt(data) {
            const canvas = document.createElement('canvas');
            canvas.width = 412;
            canvas.height = 580;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(206, 290, 0, 206, 290, 250);
            const colors = {
                0: ['#FFD700', '#1a1a2e'], 1: ['#333366', '#000000'], 2: ['#FF4500', '#FFD700'],
                3: ['#4B0082', '#000033'], 4: ['#8A2BE2', '#000033'], 5: ['#000033', '#000000'],
                6: ['#00CED1', '#4B0082'], 7: ['#000000', '#1a1a2e'], 8: ['#FFD700', '#8B0000'],
                9: ['#00CED1', '#006666'], 10: ['#FFD700', '#333366'], 11: ['#4B0082', '#FFD700'],
                12: ['#FFD700', '#FF4500'], 13: ['#000033', '#000000'], 14: ['#FFD700', '#FF8C00'],
                15: ['#00CED1', '#4B0082'], 16: ['#8A2BE2', '#000033'], 17: ['#4B0082', '#000033'],
                18: ['#FFD700', '#4B0082'], 19: ['#00CED1', '#4B0082'], 20: ['#8A2BE2', '#000033']
            };
            const c = colors[data.id] || ['#FFD700', '#000033'];
            gradient.addColorStop(0, c[0]);
            gradient.addColorStop(1, c[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 412, 580);

            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.arc(206, 290, 50 + i*30, 0, Math.PI * 2);
                ctx.stroke();
            }

            return canvas;
        }

        function createCardTexture(data) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');
            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

            const isCelestial = readingMode === 'celestial';

            if (isCelestial) {
                ctx.fillStyle = "#000011";
                ctx.fillRect(0, 0, 512, 800);

        function isLikelyOpenPalm(landmarks) {
            if (!landmarks || landmarks.length < 21) return false;

            const indexExtended = landmarks[8].y < landmarks[6].y;
            const middleExtended = landmarks[12].y < landmarks[10].y;
            const ringExtended = landmarks[16].y < landmarks[14].y;
            const pinkyExtended = landmarks[20].y < landmarks[18].y;

            const extendedCount = [indexExtended, middleExtended, ringExtended, pinkyExtended].filter(Boolean).length;
            const palmSpread = Math.abs(landmarks[5].x - landmarks[17].x);

            return extendedCount >= 2 && palmSpread > 0.08;
        }

        function detectThumbGesture(landmarks) {
            if (!landmarks || landmarks.length < 21) return null;

            const thumbTip = landmarks[4];
            const thumbIP = landmarks[3];
            const thumbExtend = thumbTip.y < thumbIP.y - 0.05;

            const indexTip = landmarks[8];
            const indexIP = landmarks[7];
            const indexClosed = indexTip.y > indexIP.y + 0.03;

            const middleTip = landmarks[12];
            const middleIP = landmarks[11];
            const middleClosed = middleTip.y > middleIP.y + 0.03;

            const otherFingersExtended = indexClosed && middleClosed;

            if (thumbExtend && otherFingersExtended) {
                return thumbTip.x < 0.5 ? 'left-thumb' : 'right-thumb';
            }

            return null;
        }

        function updateCardPositions() {
            const ease = 0.12; // easing factor for smooth interpolation
            if (cards.length < 2) return;

            // Spread cards over a bit more than a semi-circle to fan them nicely
            const angleStep = (Math.PI * 0.8) / cards.length; 

            cards.forEach((card, i) => {
                // compute target angle relative to fractional wheelOffset
                let raw = (i - wheelOffset);
                // wrap to shortest range
                const half = cards.length / 2;
                if (raw > half) raw -= cards.length;
                if (raw < -half) raw += cards.length;

                const angle = raw * angleStep; 

                let targetX, targetY, targetZ, targetScale, targetOpacity;
                let targetRotX = 0, targetRotY = 0, targetRotZ = 0;

                const drawnIndex = drawnCards.indexOf(i);

                if (drawnIndex !== -1) {
                    targetX = 0; 
                    targetY = 1.0; 
                    targetZ = 4.0;
                    targetScale = 3.2;
                    targetOpacity = 1;
                    targetRotX = 0; 
                    targetRotY = Math.PI * 2;
                    targetRotZ = 0;
                } else if (currentState === STATE.READING || currentState === STATE.SELECTED) {
                    targetX = Math.sign(raw) * (5 + Math.abs(raw) * 0.5);
                    targetY = -3 + Math.abs(raw) * 0.3;
                    targetZ = -12;
                    targetScale = 0.8;
                    targetOpacity = 0.15;
                    targetRotX = 0; 
                    targetRotY = Math.PI; // Face Down
                    targetRotZ = 0;
                } else if (currentState === STATE.WHEEL) {
                    // Arch fan placement (round format)
                    const arcRadius = 14;
                    const arcCenterY = -11.5; // Center of arch is below screen
                    
                    targetX = Math.sin(angle) * arcRadius;
                    targetY = arcCenterY + Math.cos(angle) * arcRadius;
                    targetZ = 1 - Math.abs(raw) * 0.4;
                    targetScale = Math.max(0.8, 1.8 - Math.abs(raw) * 0.05);
                    targetOpacity = 1;
                    
                    targetRotX = 0;
                    targetRotY = Math.PI; // Face Down
                    targetRotZ = -angle; // Fan out rotation
                } else {
                    // IDLE stacked
                    targetX = 0;
                    targetY = i * 0.05 - (deckData.length * 0.025);
                    targetZ = 0;
                    targetScale = 1;
                    targetOpacity = 1;
                    targetRotX = -0.2; targetRotY = Math.PI; targetRotZ = 0;
                }

                // apply smooth interpolation to position and scale
                card.position.x += (targetX - card.position.x) * ease;
                card.position.y += (targetY - card.position.y) * ease;
                card.position.z += (targetZ - card.position.z) * ease;

                // Smooth rotation using stored rotY per card
                card.userData.rotY = card.userData.rotY || Math.PI;
                card.userData.rotY += (targetRotY - card.userData.rotY) * ease;
                card.rotation.set(targetRotX, card.userData.rotY, targetRotZ);

                // When resetting, also reset stored rotY
                if (targetRotY === Math.PI && Math.abs(card.userData.rotY - Math.PI) < 0.01) {
                    card.userData.rotY = Math.PI;
                }

                const currentScale = card.scale.x || 1;
                const newScale = currentScale + (targetScale - currentScale) * ease;
                card.scale.set(newScale, newScale, newScale);

                // update material opacity smoothly
                if (Array.isArray(card.material)) {
                    card.material.forEach(m => {
                        if (!m.transparent) m.transparent = true;
                        const cur = (typeof m.opacity === 'number') ? m.opacity : 1;
                        m.opacity = cur + (targetOpacity - cur) * ease;
                    });
                }
            });
        }

        function selectCard() {
            if (currentState === STATE.READING) return;
            if (drawnCards.length >= 1) return;

            // Determine closest card to the top-center by comparing the fractional offset
            let closestDist = Infinity;
            let closestIndex = -1;
            const halfCount = Math.max(1, Math.floor(cards.length / 2));

            cards.forEach((card, i) => {
                let offset = i - wheelOffset;
                if (offset > halfCount) offset -= cards.length;
                if (offset < -halfCount) offset += cards.length;

                const dist = Math.abs(offset);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestIndex = i;
                }
            });

            if (closestIndex !== -1 && !drawnCards.includes(closestIndex)) {
                playChime();
                drawnCards.push(closestIndex);
                currentState = STATE.READING;
                showReading();
            }
        }

            composer.render();
        }

        animate();

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        function applyHeldGesture(gesture) {
            const now = Date.now();
            if (!gestureHoldStart[gesture]) {
                gestureHoldStart[gesture] = now;
                return;
            }

            const holdTime = now - gestureHoldStart[gesture];
            if (holdTime > HOLD_TIME) {
                // If we wanted to add more hold-based actions, we'd put them here.
                // For now, it just ensures the gesture is stable.
                updateDebug(gesture, `held ${Math.round(holdTime)}ms`);
            }
        }

        // --- 7. MediaPipe Integration ---
        const videoElement = document.getElementById('input-video');
        
        async function onResults(results) {
            statusDot.classList.add('active');
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandPresent = true;
                const landmarks = results.multiHandLandmarks[0];
                const requestId = ++gestureRequestId;
                
                if (showGhostHand) {
                    ghostHand.visible = true;
                    // Update Skeleton Joints & Bones
                    const now = Date.now();
                    let animFactor = 0;
                    
                    if (fistAnimStartTime > 0) {
                        const elapsed = now - fistAnimStartTime;
                        if (elapsed < FIST_ANIM_DURATION) {
                            const p = elapsed / FIST_ANIM_DURATION;
                            animFactor = Math.sin(p * Math.PI); // 0 -> 1 -> 0
                        } else {
                            // Only reset if the gesture has changed, to avoid re-triggering while held
                            // Actually, let's reset it if the user keeps holding fist, but wait for them to release first?
                            // No, let's just let it play once per 'gesture detection' event.
                        }
                    }

                    landmarks.forEach((lm, i) => {
                        let tx = (lm.x * 2 - 1) * -12; 
                        let ty = -(lm.y * 2 - 1) * 7;
                        let tz = -lm.z * 15;

                        // Automatic Open-Close Animation (Fist Response)
                        if (animFactor > 0 && i > 0) {
                            // Direction from wrist (landmark 0) to this joint
                            const wx = (landmarks[0].x * 2 - 1) * -12;
                            const wy = -(landmarks[0].y * 2 - 1) * 7;
                            const wz = -landmarks[0].z * 15;
                            
                            const dx = tx - wx;
                            const dy = ty - wy;
                            const dz = tz - wz;
                            
                            // Magnitude of the 'open' push
                            const push = 1.2 * animFactor;
                            tx += dx * push;
                            ty += dy * push;
                            tz += dz * push;
                            
                            // Pulse the glow
                            joints[i].material.emissiveIntensity = 1 + animFactor * 3;
                        } else {
                            joints[i].material.emissiveIntensity = 1;
                        }

                        joints[i].position.set(tx, ty, tz);
                    });

                    bones.forEach(b => {
                        const p1 = joints[b.pair[0]].position;
                        const p2 = joints[b.pair[1]].position;
                        b.line.geometry.setFromPoints([p1, p2]);
                    });
                } else {
                    ghostHand.visible = false;
                }
                
                // 1. Hand Position (Wrist: 0)
                handX = landmarks[0].x * window.innerWidth;
                handY = landmarks[0].y * window.innerHeight;
                
                // Simple depth heuristic: distance between wrist and middle finger base
                // Or just keep it on a plane for simplicity, use Z to push cursor back slightly
                handZ = 5 - (landmarks[0].z * 10); // Approximate 3D mapping

                updateUI();

                const thumbGesture = detectThumbGesture(landmarks);
                if (thumbGesture) {
                    handleThumbGesture(thumbGesture);
                    updateUI(thumbGesture);
                }

                if (isLikelyOpenPalm(landmarks) && currentState !== STATE.WHEEL) {
                    if (currentState === STATE.SELECTED || currentState === STATE.READING) {
                        resetSelection();
                    }
                    currentState = STATE.WHEEL;
                    updateUI('open-palm');
                    updateDebug('open-palm', 'open -> wheel (pose)');
                    return;
                }

                if (gesturePredictionInFlight) {
                    return;
                }

                gesturePredictionInFlight = true;

                try {
                    const landmarksArray = [];

                    landmarks.forEach(lm => {
                        landmarksArray.push(lm.x);
                        landmarksArray.push(lm.y);
                    });

                    const gesture = await predictGesture(landmarksArray);

                    if (requestId !== gestureRequestId) {
                        return;
                    }

                    updateDebug(gesture, 'predicted');
                    updateUI(gesture);
                    clearOtherGestureHolds(gesture);

                    // Open-palm should switch to the wheel immediately if not already
                    if (gesture === 'open-palm' && currentState !== STATE.WHEEL) {
                        if (currentState === STATE.SELECTED || currentState === STATE.READING) {
                            resetSelection();
                        }
                        currentState = STATE.WHEEL;
                        updateUI(gesture);
                        updateDebug(gesture, 'open -> wheel (immediate)');
                        return;
                    }

                    // Immediate fist selects the top-center card when wheel is active
                    if (gesture === 'fist') {
                        if (fistAnimStartTime === 0) {
                            fistAnimStartTime = Date.now();
                        }
                        
                        if (currentState === STATE.WHEEL) {
                            selectCard();
                            updateUI(gesture);
                            updateDebug(gesture, 'fist -> selected (immediate)');
                            return;
                        }
                    } else {
                        // Reset animation start when gesture is no longer fist
                        fistAnimStartTime = 0;
                    }

                    // If open-palm while selected, close selection and resume rotation
                    if (gesture === 'open-palm' && (currentState === STATE.SELECTED || currentState === STATE.READING)) {
                        resetSelection();
                        currentState = STATE.WHEEL;
                        updateUI(gesture);
                        updateDebug(gesture, 'open -> wheel (immediate)');
                        return;
                    }

                    // Other gestures (hold-based) are still handled by applyHeldGesture
                    applyHeldGesture(gesture);
                } catch (error) {
                    console.error('Gesture prediction failed:', error);
                } finally {
                    gesturePredictionInFlight = false;
                }

            } else {
                isHandPresent = false;
                gestureRequestId += 1;
                gestureHoldStart = {};
                pointBuffer = [];
                lastPointGesture = '';
                clearTimeout(pointTimeout);
                hidePointCounter();
                updateUI();
                // If hand leaves during selection, maybe stay selected? or reset?
                // Keeping state for now to allow reading without holding hand up.
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // Camera Start
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('start-overlay');
        const readingOptions = document.getElementById('reading-options');
        const startDesc = document.getElementById('start-desc');

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            startDesc.innerText = 'Select your reading style:';
            readingOptions.style.display = 'flex';
        });

        document.getElementById('single-card-btn').addEventListener('click', () => {
            readingMode = 'tarot';
            startApp();
        });

        document.getElementById('celestial-btn').addEventListener('click', () => {
            readingMode = 'celestial';
            startApp();
        });

        async function startApp() {
            try {
                // Disable option buttons
                document.getElementById('single-card-btn').disabled = true;
                document.getElementById('celestial-btn').disabled = true;
                
                // Update header based on mode
                const headerTitle = document.querySelector('header h1');
                const headerSub = document.querySelector('header p');
                if (readingMode === 'celestial') {
                    headerTitle.innerText = 'CELESTIAL ENERGIES';
                } else {
                    headerTitle.innerText = 'THE MAJOR ARCANA';
                }
                
                startDesc.innerText = 'Starting...';

                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';

                const cameraUtils = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });

                window.cameraUtils = cameraUtils;
                cameraUtils.start();
                setTimeout(() => overlay.remove(), 1000);
            } catch (err) {
                console.error(err);
                document.getElementById('single-card-btn').disabled = false;
                document.getElementById('celestial-btn').disabled = false;
                startDesc.innerText = 'Camera access denied. Please allow camera and try again.';
                overlay.style.pointerEvents = 'auto';
                overlay.style.opacity = '1';
                alert("Camera access denied or camera failed to start. Please allow camera access and try again.");
            }
        }

    </script>
</body>
</html>
